name: Linter

on: push

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 25.x
        uses: actions/setup-node@v7
        with:
          node-version: 25.x

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Lint files
        run: yarn run lint

      - name: Warn about degraded TS linting
        run: |
          echo "::warning::@typescript-eslint doesn't support TypeScript 7 yet, so the lint step above only runs Prettier against .ts files, not ESLint. Type check below still runs. Tracking: https://github.com/CSSUoB/pr-auto-updater/issues/116"

      - name: Type check
        run: yarn run typecheck
